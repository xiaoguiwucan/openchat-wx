services:
  wechat-admin-redis:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/redis:latest
    container_name: wechat-admin-redis
    restart: always
    networks:
      - wechat-robot
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    command: [ "sh", "-c", "redis-server /etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\"" ]
    volumes:
      - ./wechat_admin_redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The 8.0.74 protocol image still dials long.weixin.qq.com:80. Forward that
  # legacy endpoint to the current MMTLS port so long-link heartbeats can work.
  wechat-longlink-proxy:
    image: alpine/socat:latest
    container_name: wechat-longlink-proxy
    restart: always
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        target=$$(nslookup long.weixin.qq.com 223.5.5.5 | awk '$$1 == "Address:" && $$2 ~ /^[0-9]+\./ && $$2 !~ /:53$$/ { print $$2; exit }')
        test -n "$$target"
        exec socat -d -d TCP-LISTEN:80,fork,reuseaddr "TCP:$$target:443"
    networks:
      wechat-robot:
        aliases:
          - long.weixin.qq.com
    healthcheck:
      test: [ "CMD-SHELL", "grep -aq socat /proc/1/cmdline" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  wechat-admin-mysql:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/mysql:8.2.0
    restart: always
    container_name: wechat-admin-mysql
    networks:
      - wechat-robot
    volumes:
      - ./wechat_admin_mysql_data:/var/lib/mysql # 挂载目录，持久化存储
      - ./my.cnf:/etc/my.cnf
    environment:
      TZ: Asia/Shanghai # 设置时区
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-mysql-root}
      MYSQL_USER: wechat # 创建专用用户
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:-change-me-mysql-user}
      MYSQL_DATABASE: robot_admin # 数据库名称
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  wechat-admin-qdrant:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/qdrant:latest
    restart: always
    container_name: wechat-admin-qdrant
    networks:
      - wechat-robot
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - wechat_admin_qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-change-me-qdrant}

  wechat-server:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-server:latest
    container_name: wechat-server
    restart: always
    ports:
      - "8090:3000"
    networks:
      - wechat-robot
    volumes:
      - ./wechat-server/data:/data
    environment:
      TZ: Asia/Shanghai

  wechat-slider:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-slider:latest
    container_name: wechat-slider
    restart: always
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - UUID_SERVER_URL=http://wechat-uuid:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X GET -H 'Content-Type: application/json' http://127.0.0.1:9000/api/v1/probe | grep -q '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 2s
      retries: 12
    networks:
      - wechat-robot

  wechat-uuid:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-uuid:latest
    container_name: wechat-uuid
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST -H 'Content-Type: application/json' -d '{\"data\":\"0\"}' http://127.0.0.1:9000/api/v1/uuid | grep -q '\"code\"[[:space:]]*:[[:space:]]*200'"]
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 15s
    networks:
      - wechat-robot

  word-cloud-server:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/word-cloud-server:latest
    container_name: word-cloud-server
    restart: always
    networks:
      - wechat-robot

  jimeng-api:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/jimeng-api:latest
    container_name: jimeng-api
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      - wechat-robot

  wechat-robot-mcp-server:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-robot-mcp-server:latest
    container_name: wechat-robot-mcp-server
    restart: always
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - MCP_SERVER_PORT=9000
      - MYSQL_HOST=wechat-admin-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-me-mysql-root}
    networks:
      - wechat-robot

  xiaohongshu-mcp:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/xiaohongshu-mcp:latest
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    tty: true
    volumes:
      - ./xiaohongshu-mcp/data:/app/data
      - ./xiaohongshu-mcp/images:/app/images
    environment:
      - ROD_BROWSER_BIN=/usr/bin/google-chrome
      - COOKIES_PATH=/app/data/cookies.json
    ports:
      - "9200:9000"
    networks:
      - wechat-robot

  netease-cloud-music:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/netease-cloud-music:latest
    container_name: netease-cloud-music
    restart: unless-stopped
    tty: true
    environment:
      - ENABLE_GENERAL_UNBLOCK=true
      - ENABLE_FLAC=true
      - SELECT_MAX_BR=true
      - FOLLOW_SOURCE_ORDER=true
      - MUSIC_U=${MUSIC_U:-}
    ports:
      - "3000:3000"
    networks:
      - wechat-robot
      
  wechat-robot-admin-frontend:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-robot-admin-frontend:latest
    container_name: wechat-robot-admin-frontend
    restart: always
    networks:
      - wechat-robot
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' | nc -w2 127.0.0.1 9000 | grep -i '<html' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  wechat-robot-admin-backend:
    image: registry.cn-shenzhen.aliyuncs.com/houhou/wechat-robot-admin-backend:latest
    container_name: wechat-robot-admin-backend
    restart: always
    networks:
      - wechat-robot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GIN_MODE: release
      TZ: Asia/Shanghai
      DOCKER_NETWORK: wechat-robot
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOGIN_METHOD: token
      LOGIN_TOKEN: ${LOGIN_TOKEN:-change-me-login-token}
      WECHAT_SERVER_ADDRESS: http://wechat-server:3000
      WECHAT_SERVER_TOKEN: ${WECHAT_SERVER_TOKEN:-change-me-wechat-server-token}
      WECHAT_OFFICIAL_ACCOUNT_AUTH_URL: ${WECHAT_OFFICIAL_ACCOUNT_AUTH_URL:-https://img.houhoukang.com/uranus/qrcode_for_gh.jpg}
      SLIDER_SERVER_BASE_URL: http://wechat-slider:9000
      SLIDER_TOKEN: ${SLIDER_TOKEN:-}
      UUID_URL: http://wechat-slider:9000
      HOST_DATA_DIR: ${PWD}  # 自动取 docker-compose.yml 所在目录的绝对路径
      MYSQL_DRIVER: mysql
      MYSQL_HOST: wechat-admin-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-mysql-root}
      MYSQL_DB: robot_admin
      REDIS_HOST: wechat-admin-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      QDRANT_HOST: wechat-admin-qdrant
      QDRANT_PORT: 6334
      QDRANT_API_KEY: ${QDRANT_API_KEY:-change-me-qdrant}
      THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-change-me-third-party-api-key}
    depends_on:
      wechat-admin-redis:
        condition: service_healthy
      wechat-admin-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /api/v1/probe HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' | nc -w2 127.0.0.1 9000 | grep 'success' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  wechat-nginx:
    image: "${REGISTRY:-docker.io}/nginx:latest"
    container_name: wechat-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/nginx:/etc/nginx/certs:ro
    networks:
      - wechat-robot
    depends_on:
      wechat-robot-admin-frontend:
        condition: service_healthy
      wechat-robot-admin-backend:
        condition: service_healthy

networks:
  wechat-robot:
    external: true

volumes:
  wechat_admin_qdrant_data:
