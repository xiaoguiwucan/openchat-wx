<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenChat WX 模型渠道</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--text:#17202a;--muted:#68727d;--line:#dce1e6;--brand:#147d64;--brand2:#0f6753;--danger:#b93831;--blue:#2767b1;--amber:#9a6410}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:0}
    button,input,select{font:inherit;letter-spacing:0}.shell{min-height:100vh}.topbar{height:58px;background:#18222b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:3px solid var(--brand)}
    .brand{font-size:18px;font-weight:700}.brand small{font-size:12px;font-weight:500;color:#b9c4cc;margin-left:10px}.status{font-size:12px;color:#c7d2d9}
    .workspace{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 58px)}.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:18px}.content{padding:24px;max-width:1040px;width:100%;margin:0 auto}
    .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.section-title{font-size:15px;font-weight:700;margin:0}.hint{color:var(--muted);font-size:12px}.provider-list{margin-top:14px;display:grid;gap:6px}
    .provider{width:100%;text-align:left;border:1px solid transparent;background:#f7f8f9;padding:11px 12px;border-radius:6px;cursor:pointer;color:var(--text)}.provider:hover{border-color:#aeb8c1}.provider.selected{background:#e9f5f1;border-color:#74ab9d}.provider-name{font-weight:650;overflow-wrap:anywhere}.provider-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
    .badge{display:inline-flex;align-items:center;min-height:20px;padding:1px 7px;border-radius:999px;font-size:11px;background:#e7ebef;color:#4b5660;margin-left:6px}.badge.active{background:#d9eee7;color:#0b624d}.badge.target{background:#e2ecf8;color:#205895}
    button{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}button:hover{background:#f1f3f5}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.primary:hover{background:var(--brand2)}button.danger{color:var(--danger);border-color:#e1aaa7}button:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.scope-band{background:#edf1f4;border:1px solid var(--line);padding:12px 14px;border-radius:6px;display:grid;grid-template-columns:150px minmax(220px,1fr) auto;gap:10px;align-items:end;margin-bottom:20px}
    label{display:block;font-size:12px;font-weight:650;color:#4b5660;margin-bottom:5px}input,select{width:100%;height:38px;border:1px solid #bdc6ce;border-radius:5px;background:#fff;padding:0 10px;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 2px #d8eee8}
    .editor{background:var(--surface);border:1px solid var(--line);border-radius:6px}.editor-head{padding:16px 18px;border-bottom:1px solid var(--line)}.editor-body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.wide{grid-column:1/-1}.model-band{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;margin-top:2px}.model-band h3{font-size:13px;margin:0 0 12px}.actions{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:14px 18px}.actions-right{display:flex;gap:8px;flex-wrap:wrap}
    .notice{display:none;margin-bottom:16px;padding:10px 12px;border-radius:5px;border:1px solid}.notice.show{display:block}.notice.ok{background:#eaf6f1;border-color:#99cdbd;color:#0b624d}.notice.error{background:#fff0ef;border-color:#e4aaa6;color:#9d2923}.empty{padding:44px 20px;text-align:center;color:var(--muted)}
    @media(max-width:800px){.topbar{padding:0 14px}.brand small{display:none}.workspace{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.content{padding:16px}.scope-band{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wide,.model-band{grid-column:1}.actions{align-items:flex-start;flex-direction:column}.actions-right{width:100%}.actions-right button{flex:1}.provider-list{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand">OpenChat WX <small>模型渠道管理</small></div><div id="connection" class="status">正在读取配置</div></header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="row between"><h2 class="section-title">渠道</h2><button id="newBtn" type="button" title="新建模型渠道">+ 新建</button></div>
      <div class="hint" style="margin-top:5px">每个渠道独立保存地址、密钥及任务模型。</div>
      <div id="providerList" class="provider-list"></div>
    </aside>
    <section class="content">
      <div id="notice" class="notice"></div>
      <div class="scope-band">
        <div><label for="scope">切换范围</label><select id="scope"><option value="global">全局默认</option><option value="chat_room">指定群聊</option><option value="friend">指定好友</option></select></div>
        <div><label for="targetId">目标 ID</label><input id="targetId" placeholder="群聊 ID，例如 123456@chatroom" disabled></div>
        <button id="reloadBtn" type="button">读取当前选择</button>
      </div>
      <div id="empty" class="editor empty">选择左侧渠道，或新建一个模型渠道。</div>
      <form id="editor" class="editor" hidden>
        <div class="editor-head row between"><div><h2 id="editorTitle" class="section-title">新建渠道</h2><div id="editorSubtitle" class="hint"></div></div><label class="row" style="margin:0"><input id="enabled" type="checkbox" style="width:18px;height:18px">启用</label></div>
        <div class="editor-body grid">
          <div><label for="name">渠道名称</label><input id="name" required placeholder="例如 Bigsea 主渠道"></div>
          <div><label for="baseUrl">Base URL</label><input id="baseUrl" required placeholder="https://example.com/v1"></div>
          <div class="wide"><label for="apiKey">API Key</label><input id="apiKey" type="password" autocomplete="new-password" placeholder="编辑时留空表示保持原密钥"></div>
          <div class="model-band"><h3>任务模型</h3><div class="grid">
            <div><label for="chatModel">对话模型</label><input id="chatModel" required></div>
            <div><label for="visionModel">识图模型</label><input id="visionModel"></div>
            <div><label for="imageModel">绘图模型</label><input id="imageModel"></div>
            <div><label for="summaryModel">群总结模型</label><input id="summaryModel"></div>
            <div><label for="imageSize">绘图尺寸</label><input id="imageSize" value="1024x1024"></div>
            <div><label for="imageQuality">绘图质量</label><input id="imageQuality" placeholder="可留空"></div>
          </div></div>
        </div>
        <div class="actions"><button id="deleteBtn" class="danger" type="button">删除渠道</button><div class="actions-right"><button id="testBtn" type="button">测试连接</button><button id="selectBtn" type="button">应用到当前范围</button><button class="primary" type="submit">保存渠道</button></div></div>
      </form>
    </section>
  </main>
</div>
<script>
const api='/api/v1/robot/ai-providers';let providers=[],selectedId=0;
const $=id=>document.getElementById(id);const fields=['name','baseUrl','apiKey','chatModel','visionModel','imageModel','summaryModel','imageSize','imageQuality'];
function notify(message,type='ok'){const el=$('notice');el.textContent=message;el.className='notice show '+type;window.setTimeout(()=>el.className='notice',5000)}
async function request(url,options={}){const res=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const body=await res.json();if(body.code!==200)throw new Error(body.message||'请求失败');return body.data}
function query(){const scope=$('scope').value,target=$('targetId').value.trim();return `?scope=${encodeURIComponent(scope)}&target_id=${encodeURIComponent(target)}`}
async function load(){try{providers=await request(api+query());renderList();$('connection').textContent=`已加载 ${providers.length} 个渠道`;if(selectedId){const p=providers.find(x=>x.id===selectedId);if(p)edit(p)}}catch(e){notify(e.message,'error');$('connection').textContent='配置读取失败'}}
function renderList(){const root=$('providerList');root.innerHTML='';providers.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='provider'+(p.id===selectedId?' selected':'');b.innerHTML=`<div class="provider-name">${escapeHTML(p.name)}${p.global_selected?'<span class="badge active">全局</span>':''}${p.target_selected&&!p.global_selected?'<span class="badge target">当前范围</span>':''}</div><div class="provider-meta">${escapeHTML(p.chat_model)} · ${escapeHTML(p.base_url)}</div>`;b.onclick=()=>edit(p);root.appendChild(b)})}
function edit(p){selectedId=p.id;$('empty').hidden=true;$('editor').hidden=false;$('editorTitle').textContent=p.name;$('editorSubtitle').textContent=`密钥 ${p.api_key_masked||'未设置'}`;$('name').value=p.name;$('baseUrl').value=p.base_url;$('apiKey').value='';$('chatModel').value=p.chat_model;$('visionModel').value=p.image_recognition_model||'';$('imageModel').value=p.image_generation_model||'';$('summaryModel').value=p.summary_model||'';$('imageSize').value=p.image_size||'1024x1024';$('imageQuality').value=p.image_quality||'';$('enabled').checked=p.enabled;$('deleteBtn').disabled=false;renderList()}
function fresh(){selectedId=0;$('empty').hidden=true;$('editor').hidden=false;$('editor').reset();$('enabled').checked=true;$('imageSize').value='1024x1024';$('editorTitle').textContent='新建渠道';$('editorSubtitle').textContent='保存后即可测试并切换';$('deleteBtn').disabled=true;renderList()}
function payload(){return{name:$('name').value.trim(),base_url:$('baseUrl').value.trim(),api_key:$('apiKey').value.trim(),chat_model:$('chatModel').value.trim(),image_recognition_model:$('visionModel').value.trim(),image_generation_model:$('imageModel').value.trim(),summary_model:$('summaryModel').value.trim(),image_size:$('imageSize').value.trim(),image_quality:$('imageQuality').value.trim(),enabled:$('enabled').checked}}
$('editor').onsubmit=async e=>{e.preventDefault();try{const p=await request(selectedId?`${api}/${selectedId}`:api,{method:selectedId?'PUT':'POST',body:JSON.stringify(payload())});selectedId=p.id;notify('渠道已保存');await load()}catch(err){notify(err.message,'error')}};
$('newBtn').onclick=fresh;$('reloadBtn').onclick=load;$('scope').onchange=()=>{$('targetId').disabled=$('scope').value==='global';load()};
$('testBtn').onclick=async()=>{if(!selectedId)return notify('请先保存渠道','error');$('testBtn').disabled=true;try{const r=await request(`${api}/${selectedId}/test`,{method:'POST',body:'{}'});notify(r.success?`${r.message}，耗时 ${r.latency_ms}ms`:r.message,r.success?'ok':'error')}catch(e){notify(e.message,'error')}finally{$('testBtn').disabled=false}};
$('selectBtn').onclick=async()=>{if(!selectedId)return notify('请先选择渠道','error');const scope=$('scope').value,target=$('targetId').value.trim();if(scope!=='global'&&!target)return notify('请填写目标 ID','error');try{await request(`${api}/select`,{method:'POST',body:JSON.stringify({provider_id:selectedId,scope,target_id:target})});notify('模型渠道已切换');await load()}catch(e){notify(e.message,'error')}};
$('deleteBtn').onclick=async()=>{if(!selectedId||!confirm('确认删除这个模型渠道？'))return;try{await request(`${api}/${selectedId}`,{method:'DELETE'});selectedId=0;$('editor').hidden=true;$('empty').hidden=false;notify('渠道已删除');await load()}catch(e){notify(e.message,'error')}};
function escapeHTML(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
load();
</script>
</body>
</html>
